<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Archivo";
    src: url("_next/static/media/c214ffb7f5362987-s.p.woff2")
      format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 40px;
    padding: 56px 24px 56px 64px;
    background: oklch(0.145 0.035 265);
    color: oklch(0.97 0.005 265);
    font-family: "Archivo", sans-serif;
    font-variation-settings: "wdth" 112;
    -webkit-font-smoothing: antialiased;
  }

  /* A mesma aurora do hero, encostada no canto do produto. */
  .aurora {
    position: absolute;
    right: -14%;
    bottom: -42%;
    width: 78%;
    height: 118%;
    background: radial-gradient(
      50% 50% at 50% 50%,
      oklch(0.72 0.15 260 / 0.8) 0%,
      oklch(0.58 0.16 263 / 0.42) 42%,
      transparent 74%
    );
    filter: blur(34px);
  }

  .conteudo { position: relative; z-index: 1; }

  .marca {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.045em;
    font-variation-settings: "wdth" 100;
  }
  .marca svg { width: 30px; height: 30px; color: oklch(0.78 0.12 264); }

  h1 {
    margin-top: 30px;
    font-size: 56px;
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.035em;
    text-wrap: balance;
    max-width: 15ch;
  }

  .taxas {
    margin-top: 36px;
    display: flex;
    gap: 34px;
  }
  .taxa b {
    display: block;
    font-size: 38px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-variation-settings: "wdth" 118;
    letter-spacing: -0.035em;
  }
  .taxa span {
    display: block;
    margin-top: 3px;
    font-size: 15px;
    color: oklch(0.755 0.022 265);
    font-variation-settings: "wdth" 100;
  }
  .pix b { color: oklch(0.78 0.12 264); }

  .rodape {
    margin-top: 38px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    color: oklch(0.755 0.022 265);
    font-variation-settings: "wdth" 100;
  }
  .rodape strong { color: oklch(0.97 0.005 265); font-weight: 600; }
  .ponto { width: 4px; height: 4px; border-radius: 50%; background: oklch(0.5 0.04 265); }

  .produto { position: relative; z-index: 1; height: 100%; }
  .produto img {
    position: absolute;
    top: 50%;
    right: -10px;
    transform: translateY(-50%) rotate(-5deg);
    height: 560px;
    width: auto;
    filter: drop-shadow(0 40px 80px oklch(0.05 0.06 264 / 0.8));
  }
</style>

<div class="aurora"></div>

<div class="conteudo">
  <div class="marca">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <rect x="2" y="3" width="14" height="14" rx="1.5" fill="currentColor" />
      <rect x="23" y="3" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="3" />
      <rect x="2" y="24" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="3" />
      <rect x="21" y="22" width="24" height="24" rx="2" fill="currentColor" />
    </svg>
    useQuadri
  </div>

  <h1>Menos taxa. Mais lucro. Mais negócio.</h1>

  <div class="taxas">
    <div class="taxa pix"><b>0,00%</b><span>Pix</span></div>
    <div class="taxa"><b>0,75%</b><span>Débito</span></div>
    <div class="taxa"><b>2,69%</b><span>Crédito</span></div>
  </div>

  <div class="rodape">
    <strong>+2.500 estabelecimentos</strong>
    <i class="ponto"></i>
    Brasil inteiro, desde 2021
    <i class="ponto"></i>
    usequadri.com
  </div>
</div>

<div class="produto">
  <img src="img/maquininha.webp" alt="" />
</div>
